name: Extract ZIP in Repository

on:
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip uploaded file
        run: |
          unzip "plugin-auto-alt-caption-title-on-images-ai-enhanced-master.zip" -d extracted

      - name: Move extracted files to repository root
        run: |
          shopt -s dotglob
          mv extracted/* .
          rm -rf extracted
          rm -f "plugin-auto-alt-caption-title-on-images-ai-enhanced-master.zip"

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add .
          git commit -m "Extract ZIP file into repository" || echo "No changes to commit"
          git push
